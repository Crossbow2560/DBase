services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # 127.0.0.1 on every service: the Cloudflare Tunnel reaches them on localhost, and
      # Docker-published ports bypass ufw, so 0.0.0.0 exposes them to the LAN and to every other
      # container on this machine (through its network gateway).
      # Both sides driven by the same var (root .env's PORT) — change it if 3000 is already taken
      # on this machine by something else. See .env.example.
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    # Every key in the root .env is passed straight through to the backend process. Compose's own
    # `.env` auto-load only does `${VAR}` substitution *into this file* — it does NOT put anything
    # inside the container; that needs env_file (whole file) or environment (named vars). With this
    # here, a new backend env var (e.g. RESEND_WEBHOOK_SECRET) just needs a line in .env — no edit
    # to this file. The `environment:` block below still wins for the few keys it remaps or
    # defaults (MINIO_ACCESS_KEY <- MINIO_ROOT_USER, etc.).
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Not read by the running server itself — only by scripts/migrate.ts (npm run migrate) as a
      # fallback if DATABASE_URL above is ever unset. migrate.ts uses DATABASE_URL by default, not
      # this: DIRECT_URL's host only accepts IPv6, which this app's self-hosted runner has no
      # outbound route to (real deploy failure, see migrate.ts's own comment for the full story) —
      # kept wired through mainly so a machine that DOES have IPv6 (e.g. local dev) still works.
      DIRECT_URL: ${DIRECT_URL}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dbase_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      DEFAULT_USER_QUOTA_BYTES: ${DEFAULT_USER_QUOTA_BYTES:-16106127360}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      # The link a verification/password-reset email points at — must be wherever a real browser
      # can reach the frontend, same "change this for a non-localhost deployment" category as
      # MINIO_PUBLIC_ENDPOINT below. Defaults to this compose topology's own local dev address.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:${FRONTEND_PORT:-3001}}
      # Unset by default — sendEmail() (src/lib/email.ts) falls back to logging the message
      # instead of failing when this is empty, so registration/password-reset still work
      # end-to-end without real email infra configured. Set both to actually send email.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      # RESEND_WEBHOOK_SECRET / EMAIL_INBOUND_ADDRESS (inbound mail, src/modules/email/routes.ts)
      # are not listed here on purpose — they flow in through env_file above, straight from .env.
      PORT: ${PORT:-3000}
      # How the backend itself reaches MinIO (src/modules/storage/client.ts): the compose service
      # name over the Docker-internal network. Never handed to a browser — see MINIO_PUBLIC_* below.
      MINIO_ENDPOINT: minio
      MINIO_PORT: ${MINIO_PORT:-9000}
      # The Docker-internal MinIO container talks plain HTTP over the compose network — this has
      # no reason to ever be true, but it's still wired through .env for consistency/completeness
      # rather than silently hardcoded, in case someone terminates TLS in front of MinIO itself.
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dbase
      # Distinct from MINIO_ENDPOINT above (src/config.ts's minio.publicEndpoint comment): that
      # one is the Docker-internal service name the backend uses to actually reach MinIO, which
      # is meaningless to a real browser. This is the host a browser can reach MinIO's S3 API on
      # to actually load a presigned URL — defaults to this machine's own address since MinIO's
      # port is published to the host below. Set to this server's real public
      # domain/IP for a non-local deployment.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      # Defaults to MINIO_PORT above (not always 9000) — if you changed MINIO_PORT, this tracks it
      # automatically unless MINIO_PUBLIC_PORT is set explicitly for a fronting reverse proxy.
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-${MINIO_PORT:-9000}}
      # Was previously missing from this environment block entirely — setting it in .env alone
      # did nothing, since Compose only forwards vars a service's `environment:` explicitly names.
      # Matters whenever MinIO sits behind a TLS-terminating proxy (e.g. a Cloudflare Tunnel
      # hostname), which needs this true even though MINIO_USE_SSL above stays false.
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
    depends_on:
      minio:
        condition: service_healthy
      # The backend reads and writes the `dbase` bucket from its first request (uploads, the
      # thumbnail worker), so it must not start before minio-init has created it.
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      # MUST be a build arg, not (only) a runtime environment var: next.config.js's rewrites()
      # is evaluated once at `next build` time (see web/Dockerfile and web/next.config.js's
      # comments — this was a real bug, found by running the built container). The default in
      # web/Dockerfile already matches this compose topology, so this line is mostly
      # documentation of *why* the image is only correct in this specific topology, but it's
      # made explicit rather than relying on the Dockerfile default silently matching by luck.
      args:
        # Docker-internal by default (correct for this compose file's own networking,
        # regardless of what public domain users actually visit — this URL is only ever used
        # server-side, inside the frontend container, to reach the backend container by its
        # Docker Compose service name). Tracks PORT above automatically. Only override via .env
        # if the frontend and backend are NOT both running under this same docker-compose.yml
        # (e.g. deployed as separate services on different hosts) — in that case, set it to
        # wherever the backend is actually reachable FROM the frontend container.
        BACKEND_URL: ${BACKEND_URL:-http://backend:${PORT:-3000}}
    ports:
      # Both sides driven by the same var (root .env's FRONTEND_PORT) — change it if 3001 is
      # already taken on this machine. See .env.example.
      - "127.0.0.1:${FRONTEND_PORT:-3001}:${FRONTEND_PORT:-3001}"
    environment:
      # Runtime, unlike BACKEND_URL above — Next's standalone server.js reads this directly at
      # container start, so no rebuild needed just to change the port.
      PORT: ${FRONTEND_PORT:-3001}
    depends_on:
      - backend
    restart: unless-stopped

  minio:
    # Pinned rather than :latest — this tag was current stable as of the day encryption-at-rest
    # was wired up (matched against :latest's own digest at the time); a security-relevant config
    # change deserves a reproducible image rather than whatever floats in later.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    # --address / --console-address (rather than leaving the S3 API on its 9000 default) so the
    # var below drives the container's actual listening port too, not just the host-side publish
    # — keeps both sides of the "ports:" mapping numerically identical, same reasoning as PORT
    # above.
    command: server /data --address ":${MINIO_PORT:-9000}" --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:${MINIO_PORT:-9000}" # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:${MINIO_CONSOLE_PORT:-9001}" # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Tier-1 (storage-layer, operator-managed) encryption at rest: MinIO's built-in single-key
      # KMS. `<key-name>:<32-byte-base64-key>` — generate with:
      #   dbase-master:$(openssl rand -base64 32)
      # Setting this alone does NOT encrypt anything by itself — it only makes the key available
      # for a bucket that has default encryption turned on (see minio-init's `mc encrypt set`
      # below). No rotation support in this single-key mode; rotating means re-encrypting every
      # existing object under a new key, not swapping this value.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
      # `mc ready local` below only works out of the box on the image's default port 9000 — the
      # image's entrypoint pre-configures a "local" alias pointed at localhost:9000 unconditionally,
      # ignoring the --address above. MC_HOST_local is mc's own env-based alias override (mc reads
      # MC_HOST_<alias> directly, takes priority over any pre-configured alias) — this is what
      # actually makes the healthcheck follow MINIO_PORT. Found by reproducing the exact "unhealthy,
      # dependency failed to start" failure locally: the healthcheck log showed it dialing
      # localhost:9000 and getting connection refused even though the server was correctly listening
      # on the custom port.
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@localhost:${MINIO_PORT:-9000}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: ensures the app's bucket exists (with default encryption), then exits. The backend
  # waits for it via `condition: service_completed_successfully` — `service_healthy` on minio alone
  # only guarantees MinIO is up, not that the bucket exists.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    # mc encrypt set is idempotent (safe to re-run on every `docker compose up`), but it only
    # ever applies going forward — objects already sitting in the bucket from before this line
    # first ran stay unencrypted at rest until manually re-encrypted (docs/DESIGN.md).
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:$$MINIO_PORT $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/dbase &&
      mc encrypt set sse-s3 local/dbase
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PORT: ${MINIO_PORT:-9000}

  # ---------------------------------------------------------------------------------------------
  # Integration-test services (`npm run test:db:up`) — only started with `--profile test`, never by
  # a plain `docker compose up`. Throwaway by design: data lives in tmpfs and nothing here touches
  # the real Supabase database or the app's MinIO bucket. The harness (test/integration/harness.ts)
  # creates a fresh database per test file and applies supabase/migrations/ to it.
  # ---------------------------------------------------------------------------------------------
  test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbase_test
      POSTGRES_PASSWORD: dbase_test
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-54329}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dbase_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  test-minio:
    profiles: ["test"]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: dbase_test
      MINIO_ROOT_PASSWORD: dbase_test_secret
    ports:
      - "127.0.0.1:${TEST_MINIO_PORT:-59000}:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  minio-data:
