name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          # Default checkout runs `git clean -ffdx`, which would delete the
          # server's untracked .env file on every deploy. Keep it.
          clean: false

      - name: Build images
        run: docker compose build

      - name: Restart services
        run: docker compose up -d --remove-orphans

      - name: Prune old images
        run: docker image prune -f
